version: '3.8'

services:
  post-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: post-receiver-app
    ports:
      - "8085:8085"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

