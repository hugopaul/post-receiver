spring:
  application:
    name: post-receiver

server:
  port: 8085
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.post.receiver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/post-receiver.log
    max-size: 10MB
    max-history: 10

