spring:
  application:
    name: post-receiver

server:
  port: 8085
  servlet:
    context-path: /

cors:
  allowed-origins:
    - https://acordadf.com.br
    - https://dfmobilidade.com.br

logging:
  level:
    root: INFO
    com.post.receiver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/post-receiver.log
    max-size: 10MB
    max-history: 10

wordpress:
  destination:
    base-url: ${WP_BASE_URL}
    username: ${WP_USERNAME}
    application-password: ${WP_APP_PASSWORD}
    rest-path: ${WP_REST_PATH}
    connect-timeout-seconds: 15
    read-timeout-seconds: 120
  mysql:
    enabled: ${WP_MYSQL_ENABLED}
    url: ${WP_MYSQL_URL}
    username: ${WP_MYSQL_USERNAME}
    password: ${WP_MYSQL_PASSWORD}
    table-prefix: ${WP_TABLE_PREFIX}
  meta:
    allowed-keys:
      - _wp_page_template
      - site-sidebar-layout
      - site-content-layout
      - site-content-style
      - site-sidebar-style
      - theme-transparent-header-meta
      - astra-migrate-meta-layouts
      - cta-cta_manchete
      - rank_math_primary_category
      - rank_math_seo_score
      - _seopress_analysis_target_kw
      - _seopress_robots_primary_cat
    ignored-keys:
      - _edit_lock
      - _edit_last
      - _thumbnail_id
      - _wp_old_slug
      - _encloseme
      - _pingme
      - classic-editor-remember
      - rank_math_internal_links_processed
      - rank_math_contentai_score
      - rank_math_analytic_object_id
      - _elementor_page_assets
      - _seopress_redirections_type
      - _seopress_redirections_logged_status
    ignored-prefixes:
      - _oembed_
      - _oembed_time_
